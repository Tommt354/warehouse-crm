<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ADS DROP — Вхід</title>
<link rel="icon" type="image/png" href="/public/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/public/theme.css">
<style>
/* Login page layout */
html,body{display:flex;align-items:center;justify-content:center}
.login-wrap{width:100%;max-width:400px;padding:24px}
.logo{text-align:center;margin-bottom:40px}
.logo p{font-size:13px;color:var(--text-muted);margin-top:16px}
.login-card{background:var(--bg-glass);backdrop-filter:blur(20px) saturate(180%);-webkit-backdrop-filter:blur(20px) saturate(180%);border:1px solid var(--border-default);border-radius:var(--radius-xl);padding:32px 28px}
.field{margin-bottom:20px}
.field label{display:block;font-size:11px;color:var(--text-muted);margin-bottom:8px;font-weight:600;text-transform:uppercase;letter-spacing:.5px}
.field input{width:100%;padding:14px 16px;font-size:14px;font-family:inherit;background:var(--bg-input);border:1px solid var(--border-default);border-radius:var(--radius-md);color:var(--text-primary);outline:0;transition:all var(--duration-fast)}
.field input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.login-btn{width:100%;padding:14px;font-size:14px;font-family:inherit;font-weight:600;background:var(--accent);border:none;border-radius:var(--radius-md);color:var(--bg-deep);cursor:pointer;transition:all var(--duration-fast);margin-top:8px}
.login-btn:hover{background:var(--accent-hover);transform:translateY(-1px)}
.login-btn:disabled{opacity:.5;cursor:default;transform:none}
.error{color:var(--error);font-size:12px;text-align:center;margin-top:16px;min-height:20px}
.sp{display:inline-block;width:16px;height:16px;border:2px solid rgba(8,10,15,.3);border-top-color:var(--bg-deep);border-radius:50%;animation:spin .7s linear infinite;vertical-align:middle;margin-right:6px}
@keyframes spin{to{transform:rotate(360deg)}}
/* Dev quick-login — only rendered when the server has DEV_QUICK_LOGIN=1 */
.dev-login{margin-top:20px;padding-top:20px;border-top:1px dashed var(--border-strong)}
.dev-login-label{display:flex;align-items:center;gap:8px;font-size:10px;color:var(--text-muted);text-transform:uppercase;letter-spacing:.5px;margin-bottom:10px;justify-content:center}
.dev-login-label b{color:var(--warning);border:1px solid rgba(245,158,11,.3);background:var(--warning-soft);padding:2px 6px;border-radius:4px;font-size:9px}
.dev-login-btns{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.dev-login-btns button{flex:1;min-width:90px;padding:10px 12px;font-size:12px;font-family:inherit;font-weight:500;background:var(--bg-card);border:1px solid var(--border-default);border-radius:var(--radius-md);color:var(--text-secondary);cursor:pointer;transition:all var(--duration-fast)}
.dev-login-btns button:hover{color:var(--text-primary);border-color:var(--accent);background:var(--accent-soft)}
</style>
<script src="/public/icons.js"></script>
</head>
<body>
<div class="login-wrap">
  <div class="logo">
    <img src="/public/logo-white.png" alt="ADS DROP" style="height:56px;width:auto">
    <p>Система управління складом</p>
  </div>
  <div class="login-card">
    <div class="field"><label>Логін</label><input id="username" type="text" placeholder="Введіть логін" autocomplete="username" autofocus></div>
    <div class="field"><label>Пароль</label><input id="password" type="password" placeholder="Введіть пароль" autocomplete="current-password"></div>
    <button class="login-btn" id="login-btn" onclick="doLogin()">Увійти</button>
    <div class="error" id="error"></div>
    <div class="dev-login" id="dev-login" style="display:none">
      <div class="dev-login-label"><b>DEV</b> Швидкий вхід без пароля</div>
      <div class="dev-login-btns">
        <button onclick="devLogin('admin')">Адмін</button>
        <button onclick="devLogin('dropshipper')">Дроп</button>
        <button onclick="devLogin('packer')">Пакувальник (База)</button>
        <button onclick="devLogin('packer_molod')">Пакувальник (Молодіжна)</button>
        <button onclick="devLogin('finalizer')">Пакувальниця (фінал.)</button>
        <button onclick="devLogin('packer_ready')">Пакувальник (Готовий товар)</button>
        <button onclick="devLogin('seamstress')">Швея</button>
        <button onclick="devLogin('printer')">Принтувальник</button>
      </div>
    </div>
  </div>
</div>
<script>
fetch("/api/auth/me").then(r=>{if(r.ok)return r.json();throw 0}).then(d=>{window.location.href="/"}).catch(()=>{});
fetch("/api/auth/dev-login-enabled").then(r=>r.json()).then(d=>{if(d.enabled)document.getElementById("dev-login").style.display="block"}).catch(()=>{});
async function devLogin(role){
  const err=document.getElementById("error");err.textContent="";
  try{
    const r=await fetch("/api/auth/dev-login/"+role,{method:"POST"});
    const d=await r.json();
    if(!r.ok){err.textContent=d.error;return}
    window.location.href=d.redirect||"/";
  }catch(e){err.textContent="Помилка з'єднання"}
}
document.getElementById("password").addEventListener("keydown",e=>{if(e.key==="Enter")doLogin()});
document.getElementById("username").addEventListener("keydown",e=>{if(e.key==="Enter")document.getElementById("password").focus()});
async function doLogin(){
  const btn=document.getElementById("login-btn"),err=document.getElementById("error");
  const username=document.getElementById("username").value.trim(),password=document.getElementById("password").value;
  if(!username||!password){err.textContent="Введіть логін і пароль";return}
  btn.disabled=true;btn.innerHTML='<span class="sp"></span>Вхід...';err.textContent="";
  try{
    const r=await fetch("/api/auth/login",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({username,password})});
    const d=await r.json();
    if(!r.ok){err.textContent=d.error;btn.disabled=false;btn.textContent="Увійти";return}
    window.location.href=d.redirect||"/";
  }catch(e){err.textContent="Помилка з'єднання";btn.disabled=false;btn.textContent="Увійти"}
}
</script>
</body>
</html>
