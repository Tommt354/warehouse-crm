<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CRM — Склад</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');
:root{--bg:#0a0e17;--card:#111827;--input:#0d1220;--brd:#1e2740;--brd2:#2a3a5c;--t:#c8cdd5;--td:#5a6378;--th:#f0f2f5;--acc:#00d4aa;--accbg:rgba(0,212,170,.06);--red:#ff6b6b;--redbg:rgba(255,107,107,.06);--warn:#ffa726;--warnbg:rgba(255,167,38,.06);--blue:#42a5f5;--r:14px}
*{margin:0;padding:0;box-sizing:border-box}
html,body{background:var(--bg);color:var(--t);font-family:'Inter',sans-serif;min-height:100vh}
.wrap{max-width:700px;margin:0 auto;padding:14px 14px 40px}
.hdr{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--brd);margin-bottom:14px}
.hdr h1{font-size:17px;font-weight:700;color:var(--th)}.hdr small{font-size:11px;color:var(--td);display:block;margin-top:2px}
.btn-out{background:none;border:1px solid var(--brd);border-radius:7px;color:var(--td);padding:7px 14px;font-size:11px;font-family:inherit;cursor:pointer}
.tabs{display:flex;gap:4px;margin-bottom:16px}
.tab{padding:10px 20px;font-size:13px;font-family:inherit;font-weight:600;background:var(--card);border:1px solid var(--brd);border-radius:10px;color:var(--td);cursor:pointer;transition:.15s}
.tab.on{color:var(--acc);border-color:rgba(0,212,170,.2);background:var(--accbg)}
.tab .cnt{font-family:'JetBrains Mono',monospace;font-weight:700;margin-left:4px;font-size:12px}
/* Order card - big and informative */
.ocard{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);margin-bottom:14px;overflow:hidden}
.ocard-header{padding:14px 16px;display:flex;justify-content:space-between;align-items:flex-start;border-bottom:1px solid var(--brd)}
.ocard-id{font-size:18px;font-weight:700;color:var(--th)}
.ocard-status{margin-left:8px}
.ocard-client{margin-top:4px}
.ocard-client .cl-name{font-size:14px;font-weight:600;color:var(--th)}
.ocard-client .cl-phone{font-size:13px;color:var(--acc);font-family:'JetBrains Mono',monospace}
.ocard-client .cl-addr{font-size:12px;color:var(--td);margin-top:2px}
.ocard-meta{text-align:right;font-size:11px;color:var(--td)}
.ocard-meta .drop-name{color:var(--blue);font-weight:500}
.ocard-ttn{font-family:'JetBrains Mono',monospace;font-size:12px;color:var(--warn);margin-top:2px}
/* Order item - big photo */
.oitem{display:flex;gap:12px;padding:12px 16px;border-bottom:1px solid rgba(30,39,64,.5);align-items:center}
.oitem:last-child{border:none}
.oitem-img{width:80px;height:80px;border-radius:10px;overflow:hidden;background:var(--bg);flex-shrink:0}
.oitem-img img{width:100%;height:100%;object-fit:cover}
.oitem-info{flex:1}
.oitem-name{font-size:14px;font-weight:600;color:var(--th)}
.oitem-print{font-size:11px;color:var(--warn);margin-top:2px}
.oitem-size{display:inline-block;font-size:14px;font-weight:700;color:var(--acc);background:var(--accbg);padding:3px 12px;border-radius:6px;margin-top:4px}
.oitem-qty{font-size:13px;color:var(--td);margin-top:2px}
.oitem-ret{margin-top:4px}
.oitem-ret-badge{font-size:10px;padding:3px 8px;border-radius:5px;background:var(--warnbg);color:var(--warn);border:1px solid rgba(255,167,38,.2)}
.oitem-ret-ok{font-size:10px;padding:3px 8px;border-radius:5px;background:var(--accbg);color:var(--acc)}
/* Footer */
.ocard-footer{padding:12px 16px;display:flex;justify-content:space-between;align-items:center;background:rgba(0,0,0,.15)}
.ocard-cod{font-family:'JetBrains Mono',monospace;font-size:16px;font-weight:700;color:var(--th)}
.ocard-note{font-size:12px;color:var(--warn);margin-top:4px;padding:6px 10px;background:var(--warnbg);border-radius:6px;border:1px solid rgba(255,167,38,.15)}
.btn{padding:10px 20px;font-size:13px;font-family:inherit;font-weight:600;border:1px solid var(--brd);border-radius:10px;cursor:pointer;transition:.15s;background:var(--card);color:var(--t)}
.btn:hover{border-color:var(--brd2)}
.btn-p{background:var(--acc);color:#0a0e17;border-color:var(--acc)}.btn-p:hover{opacity:.9}
.btn-done{background:#22c55e;color:#fff;border-color:#22c55e;font-size:14px;padding:12px 24px}
.btn-done:hover{opacity:.9}
.btn-w{border-color:rgba(255,167,38,.3);color:var(--warn);background:var(--warnbg)}
.btn-d{border-color:rgba(255,107,107,.2);color:var(--red)}
.btn-sm{padding:6px 12px;font-size:11px}
.tag{display:inline-block;font-size:10px;font-weight:600;padding:3px 10px;border-radius:6px}
.tag-new{background:var(--accbg);color:var(--acc);border:1px solid rgba(0,212,170,.15)}
.tag-prog{background:rgba(66,165,245,.08);color:var(--blue);border:1px solid rgba(66,165,245,.15)}
.tag-done{background:rgba(34,197,94,.08);color:#22c55e;border:1px solid rgba(34,197,94,.15)}
.tag-bad{background:var(--redbg);color:var(--red);border:1px solid rgba(255,107,107,.15)}
.empty{text-align:center;padding:40px;color:var(--td);font-size:14px}.empty .ic{font-size:48px;display:block;margin-bottom:8px}
/* Returns scanner */
.scan-wrap{margin-bottom:16px}
.scan-input{width:100%;padding:14px 16px;font-size:16px;font-family:'JetBrains Mono',monospace;background:var(--input);border:2px solid var(--brd2);border-radius:12px;color:#fff;outline:0;text-align:center;letter-spacing:2px}
.scan-input:focus{border-color:var(--acc)}
.scan-input::placeholder{letter-spacing:0;font-family:'Inter',sans-serif;font-size:13px}
.ret-card{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);padding:16px;margin-bottom:12px}
.ret-item{display:flex;gap:12px;padding:10px 0;border-bottom:1px solid var(--brd);align-items:center}
.ret-item:last-child{border:none}
.ret-item img{width:70px;height:70px;border-radius:8px;object-fit:cover}
.ret-item-info{flex:1}
.ret-check{width:28px;height:28px;border-radius:8px;border:2px solid var(--brd2);background:var(--bg);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:16px;transition:.2s}
.ret-check.done{background:var(--acc);border-color:var(--acc);color:#0a0e17}
.msg{padding:10px 14px;border-radius:8px;font-size:12px;margin-bottom:12px}
.msg-ok{background:var(--accbg);color:var(--acc)}.msg-err{background:var(--redbg);color:var(--red)}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr">
    <div><h1>📦 Склад</h1><small id="u-info">—</small></div>
    <button class="btn-out" onclick="logout()">Вийти</button>
  </div>
  <div class="tabs">
    <div class="tab on" onclick="showTab('orders')">📋 Замовлення</div>
    <div class="tab" onclick="showTab('returns')">📦 Повернення</div>
  </div>
  <div id="v-orders">
    <div style="display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap" id="wh-status-tabs"></div>
    <div id="wh-orders"></div>
  </div>
  <div id="v-returns" style="display:none">
    <div class="scan-wrap">
      <input class="scan-input" id="scan-ttn" placeholder="Скануйте або введіть ТТН повернення..." autofocus>
    </div>
    <div id="ret-result"></div>
  </div>
</div>
<script>
let ME,curTab="orders";
const SL={new:"Нове",in_progress:"В роботі",packed:"Готово",shipped:"Відправлено",delivering:"Доставка",delivered:"Отримано",refused:"Відмова",cancelled:"Скасовано"};
const SC={new:"tag-new",in_progress:"tag-prog",packed:"tag-done",refused:"tag-bad",cancelled:"tag-bad"};

async function init(){
  try{ME=(await api("/api/auth/me")).user;
  document.getElementById("u-info").textContent=ME.name;
  loadOrders();
  document.getElementById("scan-ttn").addEventListener("keydown",e=>{if(e.key==="Enter"){e.preventDefault();scanTTN()}});
  }catch(e){location.href="/login"}
}
async function logout(){await fetch("/api/auth/logout",{method:"POST"});location.href="/login"}
function esc(s){const d=document.createElement("div");d.textContent=s||"";return d.innerHTML}
async function api(u,o){const r=await fetch(u,{headers:{"Content-Type":"application/json"},...o});const d=await r.json();if(!r.ok)throw new Error(d.error||"Err");return d}

function showTab(t){
  curTab=t;
  document.querySelectorAll(".tab").forEach((b,i)=>b.classList.toggle("on",i===(t==="orders"?0:1)));
  document.getElementById("v-orders").style.display=t==="orders"?"":"none";
  document.getElementById("v-returns").style.display=t==="returns"?"":"none";
  if(t==="orders")loadOrders();
  if(t==="returns"){document.getElementById("scan-ttn").value="";document.getElementById("scan-ttn").focus();document.getElementById("ret-result").innerHTML=""}
}

let whStatus="new";
const WH_STATUSES=[
  {key:"new",label:"📥 Нові",next:"in_progress",nextLabel:"🔧 Взяти в роботу"},
  {key:"in_progress",label:"🔧 В роботі",next:"packed",nextLabel:"✅ Готово"},
  {key:"packed",label:"✅ Готові"},
  {key:"shipped",label:"🚚 Відправлені"},
  {key:"delivered",label:"📬 Отримані"},
  {key:"refused",label:"❌ Відмови"},
  {key:"cancelled",label:"🚫 Скасовані"},
];

function renderWhTabs(){
  document.getElementById("wh-status-tabs").innerHTML=WH_STATUSES.map(s=>{
    const on=s.key===whStatus;
    return '<div style="padding:8px 14px;font-size:12px;font-weight:'+(on?'600':'500')+';background:'+(on?'var(--accbg)':'var(--card)')+';border:1px solid '+(on?'rgba(0,212,170,.2)':'var(--brd)')+';border-radius:8px;color:'+(on?'var(--acc)':'var(--td)')+';cursor:pointer" onclick="whStatus=\''+s.key+'\';renderWhTabs();loadOrders()">'+s.label+'</div>';
  }).join("");
}

async function loadOrders(){
  renderWhTabs();
  const{orders}=await api("/api/orders?status="+whStatus+"&limit=50");
  const el=document.getElementById("wh-orders");
  if(!orders.length){el.innerHTML='<div class="empty"><span class="ic">📭</span>Немає замовлень</div>';return}

  const statusInfo=WH_STATUSES.find(s=>s.key===whStatus);
  let html="";
  for(const o of orders){
    const{order}=await api("/api/orders/"+o.id);
    html+='<div class="ocard">';
    html+='<div class="ocard-header"><div>';
    html+='<div class="ocard-id">#'+o.id+' <span class="tag '+(SC[o.status]||"")+'">'+(SL[o.status]||o.status)+'</span></div>';
    html+='<div class="ocard-client"><div class="cl-name">'+esc(o.client_name)+'</div>';
    html+='<div class="cl-phone">'+esc(o.client_phone)+'</div>';
    html+='<div class="cl-addr">'+esc(o.client_city)+' · '+esc(o.client_warehouse)+'</div></div>';
    html+='</div><div class="ocard-meta">';
    html+='<div class="drop-name">'+esc(o.drop_name)+'</div>';
    html+='<div>'+(o.created_at?.slice(0,16)||"")+'</div>';
    if(o.ttn)html+='<div class="ocard-ttn">ТТН: '+esc(o.ttn)+'</div>';
    html+='</div></div>';

    for(const i of order.items){
      const hasRet=i.return_available>0;
      const usedRet=i.from_returns>0;
      html+='<div class="oitem"'+(hasRet?' style="background:rgba(255,167,38,.05)"':'')+'>';
      html+='<div class="oitem-img">'+(i.var_photo?'<img src="'+i.var_photo+'">':'<div style="width:80px;height:80px;background:var(--bg);display:flex;align-items:center;justify-content:center;color:var(--td)">📷</div>')+'</div>';
      html+='<div class="oitem-info">';
      html+='<div class="oitem-name">'+esc(i.var_name)+'</div>';
      if(i.print_name)html+='<div class="oitem-print">🖼 '+esc(i.print_name)+'</div>';
      html+='<div><span class="oitem-size">'+esc(i.size_name)+'</span></div>';
      if(i.quantity>1)html+='<div class="oitem-qty">×'+i.quantity+'</div>';
      if(hasRet)html+='<div class="oitem-ret"><span class="oitem-ret-badge">⚠️ Є повернення ('+i.return_available+' шт)</span> <button class="btn btn-sm btn-w" onclick="useReturn('+i.id+')">📦 Взяти з повернень</button></div>';
      if(usedRet)html+='<div class="oitem-ret"><span class="oitem-ret-ok">✅ З повернень: '+i.from_returns+'</span></div>';
      html+='</div></div>';
    }

    if(o.note)html+='<div style="padding:0 16px 10px"><div class="ocard-note">📝 '+esc(o.note)+'</div></div>';

    html+='<div class="ocard-footer"><div><div class="ocard-cod">Наложка: '+o.cod_amount+'₴</div></div><div style="display:flex;gap:8px">';
    if(statusInfo?.next)html+='<button class="btn btn-p" onclick="changeStatus('+o.id+',\''+statusInfo.next+'\')">'+statusInfo.nextLabel+'</button>';
    if(whStatus==="new")html+='<button class="btn btn-d btn-sm" onclick="cancelOrder('+o.id+')">✕</button>';
    html+='</div></div></div>';
  }
  el.innerHTML=html;
}

async function changeStatus(id,status){await api('/api/orders/'+id+'/status',{method:"PUT",body:JSON.stringify({status})});loadOrders()}
async function cancelOrder(id){if(!confirm("Скасувати?"))return;await api('/api/orders/'+id+'/cancel',{method:"POST"});loadOrders()}
async function useReturn(itemId){try{await api('/api/order-items/'+itemId+'/use-return',{method:"POST",body:JSON.stringify({})});loadOrders()}catch(e){alert(e.message)}}

// ── Returns scanner ──────────────────────────────────────────────
async function scanTTN(){
  const ttn=document.getElementById("scan-ttn").value.trim();
  if(!ttn)return;
  const el=document.getElementById("ret-result");
  try{
    const{order:o}=await api("/api/orders/by-ttn/"+encodeURIComponent(ttn));
    let html='<div class="ret-card">';
    html+='<div style="display:flex;justify-content:space-between;margin-bottom:10px"><div>';
    html+='<div style="font-size:16px;font-weight:700;color:var(--th)">#'+o.id+' <span class="tag '+(SC[o.status]||"")+'">'+(SL[o.status]||o.status)+'</span></div>';
    html+='<div style="font-size:13px;color:var(--th);margin-top:4px">'+esc(o.client_name)+' · '+esc(o.client_phone)+'</div>';
    html+='</div><div style="text-align:right;font-size:11px;color:var(--td)">ТТН: <span style="color:var(--warn);font-family:\'JetBrains Mono\',monospace">'+esc(o.ttn)+'</span></div></div>';

    for(const i of o.items){
      const returned=i.returned_to_stock;
      html+='<div class="ret-item">';
      html+=(i.var_photo?'<img src="'+i.var_photo+'">':'<div style="width:70px;height:70px;background:var(--bg);border-radius:8px"></div>');
      html+='<div class="ret-item-info">';
      html+='<div style="font-size:14px;font-weight:600;color:var(--th)">'+esc(i.var_name)+'</div>';
      if(i.print_name)html+='<div style="font-size:11px;color:var(--warn)">🖼 '+esc(i.print_name)+'</div>';
      html+='<div style="margin-top:4px"><span style="font-size:14px;font-weight:700;color:var(--acc);background:var(--accbg);padding:3px 12px;border-radius:6px">'+esc(i.size_name)+'</span>';
      if(i.quantity>1)html+=' <span style="color:var(--td)">×'+i.quantity+'</span>';
      html+='</div></div>';
      // Checkbox
      if(returned){
        html+='<div class="ret-check done">✓</div>';
      }else{
        html+='<div class="ret-check" onclick="returnItem('+i.id+',this)"></div>';
      }
      html+='</div>';
    }
    html+='</div>';
    el.innerHTML=html;
    document.getElementById("scan-ttn").value="";
    document.getElementById("scan-ttn").focus();
  }catch(e){
    el.innerHTML='<div class="msg msg-err">❌ '+e.message+'</div>';
  }
}

async function returnItem(itemId,el){
  try{
    await api('/api/order-items/'+itemId+'/return-to-stock',{method:"POST",body:JSON.stringify({})});
    el.classList.add("done");el.innerHTML="✓";el.onclick=null;
  }catch(e){alert(e.message)}
}

init();
</script>
</body>
</html>
