<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>ADS DROP — Пакувальниця</title>
<link rel="icon" type="image/png" href="/public/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/public/theme.css">
<style>
/* Finalizer page-specific */
.wrap{max-width:760px;margin:0 auto;padding:16px 16px 48px}
.hdr{display:flex;justify-content:space-between;align-items:center;padding-bottom:14px;border-bottom:1px solid var(--border-subtle);margin-bottom:16px}
.hdr h1{font-size:16px;font-weight:700;color:var(--text-primary);display:flex;align-items:center;gap:8px}
.hdr small{font-size:11px;color:var(--text-muted)}
/* Navigation */
.nav{display:flex;gap:4px;margin-bottom:16px}
.nav a{padding:10px 16px;font-size:12px;font-weight:600;background:var(--bg-card);backdrop-filter:blur(12px);border:1px solid var(--border-default);border-radius:var(--radius-md);color:var(--text-secondary);cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;gap:8px;transition:all var(--duration-fast)}
.nav a:hover{color:var(--text-primary);border-color:var(--border-strong)}
.nav a.on{color:var(--accent);border-color:var(--border-glow);background:var(--accent-soft)}
/* Scan input */
.scan-input{width:100%;padding:18px;font-size:18px;font-family:'JetBrains Mono',monospace;background:var(--bg-input);border:2px solid var(--border-strong);border-radius:var(--radius-lg);color:var(--text-primary);outline:0;text-align:center;letter-spacing:3px;margin-bottom:16px;transition:all var(--duration-fast)}
.scan-input:focus{border-color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.scan-input::placeholder{letter-spacing:0;font-family:'Inter',sans-serif;font-size:14px;color:var(--text-muted)}
/* Status tags */
.tag-new{background:var(--accent-soft);color:var(--accent)}
.tag-prog{background:var(--info-soft);color:var(--info)}
.tag-done{background:var(--success-soft);color:var(--success)}
.tag-ship{background:var(--warning-soft);color:var(--warning)}
.tag-bad{background:var(--error-soft);color:var(--error)}
@keyframes spin{to{transform:rotate(360deg)}}
</style>
<script src="/public/icons.js"></script>
<script src="/public/calendar.js"></script>
</head>
<body>
<div class="wrap">
<div class="hdr"><div><img src="/public/logo-white.png" alt="ADS DROP" style="height:20px;width:auto;margin-bottom:4px;display:block"><h1 style="font-size:15px;margin-top:2px"><i data-icon="package" data-size="16"></i> Пакувальниця</h1><small id="u-info">—</small></div><button class="btn-out" onclick="logout()">Вийти</button></div>
<div class="nav"><a class="on" data-p="scan"><i data-icon="camera" data-size="15"></i> Сканер</a><a data-p="stats"><i data-icon="barChart3" data-size="15"></i> Статистика</a><a data-p="salary"><i data-icon="wallet" data-size="15"></i> Моя зарплата</a><a data-p="tasks"><i data-icon="clipboardList" data-size="15"></i> Завдання</a></div>

<div class="page on" id="pg-scan">
<div class="sg">
  <div class="sc"><div class="sv" style="color:var(--acc)" id="st-today">0</div><div class="sl">сьогодні</div></div>
  <div class="sc"><div class="sv" style="color:var(--td)" id="st-yesterday">0</div><div class="sl">вчора</div></div>
  <div class="sc"><div class="sv" style="color:var(--th)" id="st-week">0</div><div class="sl">за тиждень</div></div>
</div>
<input class="scan-input" id="scan-ttn" placeholder="Скануйте ТТН посилки..." autofocus>
<button class="btn" style="width:100%;justify-content:center;margin-bottom:12px" onclick="openForeignParcel()"><i data-icon="package" data-size="15"></i> + Закордонна посилка</button>
<div id="scan-result"></div>
<div style="margin-top:14px;font-size:13px;font-weight:600;color:var(--th);margin-bottom:8px">Останні скановані:</div>
<div id="recent-scans"></div>
</div>

<div class="page" id="pg-stats">
<input id="fs-search" placeholder="Пошук по ТТН або телефону..." style="width:100%;padding:8px 12px;font-size:13px;font-family:JetBrains Mono,monospace;background:var(--input);border:1px solid var(--brd);border-radius:8px;color:#fff;outline:0;margin-bottom:10px" onkeydown="if(event.key==='Enter')searchFinTtn()">
<div id="fs-result"></div>
<div id="stats-content"></div>
</div>

<div class="page" id="pg-salary">
  <div class="acts" style="margin-bottom:6px;flex-wrap:wrap;gap:6px">
    <input type="date" id="sal-df"><span style="color:var(--td);font-size:10px">—</span><input type="date" id="sal-dt">
    <button class="btn btn-sm" style="background:var(--acc);color:#0a0e17;border-color:var(--acc);font-weight:600" onclick="loadSalary()">OK</button>
  </div>
  <div style="display:flex;gap:3px;justify-content:flex-end;margin-bottom:10px"><button class="stab" id="sal-p-7" onclick="setSalaryPeriod(7)">7д</button><button class="stab" id="sal-p-15" onclick="setSalaryPeriod(15)">15д</button><button class="stab on" id="sal-p-30" onclick="setSalaryPeriod(30)">30д</button></div>
  <div id="sal-stats" style="display:flex;gap:10px;margin-bottom:16px;flex-wrap:wrap"></div>
  <div style="font-size:13px;font-weight:600;color:var(--th);margin-bottom:8px">Нарахування за період:</div>
  <div id="sal-entries"></div>
  <div style="font-size:13px;font-weight:600;color:var(--th);margin:16px 0 8px">Історія виплат:</div>
  <div id="sal-payouts"></div>
</div>

<div class="page" id="pg-tasks">
  <div id="tasks-list"></div>
</div>
</div>

<div id="loader" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.5);z-index:9999;align-items:center;justify-content:center"><div style="background:var(--card);border:1px solid var(--brd);border-radius:14px;padding:24px 40px;text-align:center"><div style="width:36px;height:36px;border:3px solid var(--brd);border-top-color:var(--acc);border-radius:50%;animation:spin .8s linear infinite;margin:0 auto"></div><div style="color:var(--td);font-size:12px;margin-top:10px">Завантаження...</div></div></div>

<div id="fp-modal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:10000;align-items:center;justify-content:center;padding:20px">
  <div style="background:var(--card);border:1px solid var(--brd);border-radius:16px;padding:20px;max-width:360px;width:100%">
    <h3 style="font-size:16px;color:var(--th);margin:0 0 4px"><i data-icon="package" data-size="16"></i> Закордонна посилка</h3>
    <div style="font-size:12px;color:var(--td);margin-bottom:12px">Введіть номер телефону клієнта. Дата й час упаковки зафіксуються автоматично.</div>
    <input id="fp-phone" type="tel" placeholder="+380..." style="width:100%;padding:12px;font-size:16px;font-family:JetBrains Mono,monospace;background:var(--input);border:1px solid var(--brd);border-radius:10px;color:#fff;outline:0;margin-bottom:12px" onkeydown="if(event.key==='Enter')saveForeignParcel()">
    <div id="fp-msg"></div>
    <div style="display:flex;gap:8px;margin-top:8px">
      <button class="btn btn-p" style="flex:1;justify-content:center" onclick="saveForeignParcel()"><i data-icon="check" data-size="15"></i> Зафіксувати</button>
      <button class="btn" onclick="closeForeignParcel()">Скасувати</button>
    </div>
  </div>
</div>

<script>
var ME;
var SL={new:"Нове",in_progress:"В роботі",packed:"Готово",shipped:"Відправлено",delivering:"Доставка",delivered:"Отримано",refused:"Відмова",cancelled:"Скасовано"};
var SC={new:"tag-new",in_progress:"tag-prog",packed:"tag-done",shipped:"tag-ship",delivering:"tag-ship",delivered:"tag-done",refused:"tag-bad",cancelled:"tag-bad"};

var _lc=0,_lt=null;function _ls(){_lc++;if(_lt)clearTimeout(_lt);_lt=setTimeout(function(){if(_lc>0){var l=document.getElementById("loader");if(l)l.style.display="flex"}},800)}function _lh(){_lc=Math.max(0,_lc-1);if(!_lc){if(_lt){clearTimeout(_lt);_lt=null}var l=document.getElementById("loader");if(l)l.style.display="none"}}
async function api(u,o){_ls();try{var r=await fetch(u,Object.assign({headers:{"Content-Type":"application/json"}},o||{}));var d=await r.json();_lh();if(!r.ok)throw new Error(d.error||"Err");return d}catch(e){_lh();throw e}}
function ttnColor(o){var s=o.status||'';if(s==='delivered')return'#34d399';if(s==='refused'||s==='cancelled')return'var(--red)';if(s==='delivering'||s==='shipped')return'var(--blue)';return'var(--warn)'}
function copyTTN(t){navigator.clipboard.writeText(t);var d=document.createElement("div");d.style.cssText="position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--acc);color:#0a0e17;padding:6px 16px;border-radius:8px;font-size:12px;font-weight:600;z-index:99999;display:flex;align-items:center;gap:6px";d.innerHTML=Icon('check',12)+" "+esc(t)+" скопійовано";document.body.appendChild(d);setTimeout(function(){d.remove()},1500)}
function esc(s){var d=document.createElement("div");d.textContent=s||"";return d.innerHTML}
async function logout(){await fetch("/api/auth/logout",{method:"POST"});location.href="/login"}

async function init(){try{ME=(await api("/api/auth/me")).user;document.getElementById("u-info").textContent=ME.name;loadStats();loadRecent()}catch(e){location.href="/login"}}

document.querySelectorAll(".nav a").forEach(function(a){a.addEventListener("click",function(){
  document.querySelectorAll(".nav a").forEach(function(x){x.classList.remove("on")});a.classList.add("on");
  document.querySelectorAll(".page").forEach(function(x){x.classList.remove("on")});
  document.getElementById("pg-"+a.dataset.p).classList.add("on");
  if(a.dataset.p==="stats")loadFullStats();
  if(a.dataset.p==="salary")setSalaryPeriod(30);
  if(a.dataset.p==="tasks")loadStaffTasks();
})});

async function loadStaffTasks(){
  try{
    var r=await api("/api/my-tasks");
    document.getElementById("tasks-list").innerHTML=r.tasks.length?r.tasks.map(function(t){
      return '<div style="background:var(--card);border:1px solid var(--brd);border-radius:12px;margin-bottom:8px;padding:12px 14px;'+(t.status==="done"?"opacity:.6":"")+'">'+
        '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:8px">'+
        '<div style="flex:1"><div style="font-size:14px;font-weight:600;color:var(--th)">'+esc(t.title)+'</div>'+
        (t.note?'<div style="font-size:11px;color:var(--td);margin-top:2px">'+esc(t.note)+'</div>':'')+'</div>'+
        (t.is_paid&&t.amount>0?'<div style="font-family:JetBrains Mono,monospace;font-size:14px;font-weight:700;color:var(--acc)">+'+t.amount.toFixed(0)+'₴</div>':'')+
        '</div>'+
        '<div style="margin-top:8px;text-align:right"><button class="btn btn-sm '+(t.status==="done"?"":"btn-p")+'" onclick="toggleMyTaskStatus('+t.id+',\''+(t.status==="done"?"pending":"done")+'\')">'+Icon(t.status==="done"?"undo2":"check",12)+' '+(t.status==="done"?"Повернути":"Виконано")+'</button></div>'+
        '</div>';
    }).join(""):'<div class="empty"><span class="ic">'+Icon('clipboardList',30)+'</span>Немає задач</div>';
  }catch(e){}
}
async function toggleMyTaskStatus(id,status){await api("/api/my-tasks/"+id+"/status",{method:"PUT",body:JSON.stringify({status:status})});loadStaffTasks()}

document.getElementById("scan-ttn").addEventListener("keydown",function(e){if(e.key==="Enter"){e.preventDefault();doScan()}});

async function loadStats(){
  try{var r=await api("/api/scan/stats");
  document.getElementById("st-today").textContent=r.today;
  document.getElementById("st-yesterday").textContent=r.yesterday;
  document.getElementById("st-week").textContent=r.week}catch(e){}
}

async function loadRecent(){
  try{var r=await api("/api/scan/stats");
  document.getElementById("recent-scans").innerHTML=r.recent.filter(function(s){return s.scan_type==="shipment"}).slice(0,10).map(function(s){
    return '<div style="display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px solid var(--brd);font-size:11px"><div><span style="font-family:JetBrains Mono,monospace;color:var(--warn)">'+esc(s.ttn)+'</span> · '+esc(s.client_name||"")+'</div><div style="color:var(--td)">'+(s.created_at?.slice(11,16)||"")+'</div></div>'
  }).join("")||'<div style="color:var(--td);font-size:11px">Немає сканувань</div>'}catch(e){}
}

async function doScan(){
  var ttn=document.getElementById("scan-ttn").value.trim();if(!ttn)return;
  var el=document.getElementById("scan-result");
  try{
    var r=await api("/api/scan",{method:"POST",body:JSON.stringify({ttn:ttn,scan_type:"shipment"})});
    var o=r.order;
    var html='<div style="background:var(--card);border:1px solid var(--brd);border-radius:14px;overflow:hidden;margin-bottom:10px">';
    html+='<div style="padding:12px 14px"><div style="font-size:18px;font-weight:700;color:var(--th)">#'+o.id+' <span class="tag '+(SC[o.status]||"")+'">'+(SL[o.status]||o.status)+'</span></div>';
    html+='<div style="font-size:13px;color:var(--th);margin-top:4px">'+esc(o.client_name)+' · <span style="color:var(--acc)">'+esc(o.client_phone)+'</span></div>';
    html+='<div style="font-size:11px;color:var(--td)">'+esc(o.client_city)+' · '+esc(o.client_warehouse)+'</div>';
    if(o.ttn)html+='<div style="margin-top:4px;background:rgba(255,167,38,.06);border:1px solid rgba(255,167,38,.15);border-radius:8px;padding:6px 10px"><span style="font-family:JetBrains Mono,monospace;font-size:14px;font-weight:700;color:'+ttnColor(o)+';cursor:pointer" onclick="copyTTN(this.textContent)">'+esc(o.ttn)+'</span>'+(o.np_status_text?'<div style="font-size:10px;color:'+ttnColor(o)+'">'+Icon('truck',11)+' '+esc(o.np_status_text)+'</div>':'')+(o.return_ttn?'<div style="font-size:9px;color:var(--red)">'+Icon('undo2',10)+' '+esc(o.return_ttn)+'</div>':'')+'</div>';
    html+='<div style="font-family:JetBrains Mono,monospace;font-size:14px;color:var(--th);margin-top:6px">Наложка: '+o.cod_amount+'₴</div></div>';
    for(var i=0;i<o.items.length;i++){
      var it=o.items[i];var ph=it.var_photo||it.print_photo||it.bp_photo;
      html+='<div style="display:flex;gap:12px;padding:10px 14px;border-top:1px solid var(--brd);align-items:center">';
      html+=(ph?'<img src="'+ph+'" style="width:80px;height:80px;border-radius:10px;object-fit:cover">':'<div style="width:80px;height:80px;background:var(--bg);border-radius:10px"></div>');
      html+='<div style="flex:1"><div style="font-size:14px;font-weight:600;color:var(--th)">'+esc(it.var_name)+'</div>';
      html+='<div><span style="font-size:14px;font-weight:700;color:var(--acc);background:var(--accbg);padding:2px 10px;border-radius:5px">'+esc(it.size_name)+'</span>';
      if(it.original_size_name)html+=' <span style="font-size:10px"><span style="color:var(--red);text-decoration:line-through">'+esc(it.original_size_name)+'</span> → <span style="color:var(--acc)">'+esc(it.size_name)+'</span></span>';
      if(it.quantity>1)html+=' <span style="color:var(--td)">×'+it.quantity+'</span>';
      html+='</div></div></div>';
    }
    html+='<div style="padding:12px 14px;background:rgba(0,0,0,.1);text-align:center">';
    if(o.status==="packed"||o.status==="new"||o.status==="in_progress")
      html+='<button class="btn btn-p" onclick="finalizeOrder('+o.id+')">'+Icon('check',14)+' Підтвердити відправку</button>';
    else html+='<div style="color:var(--acc);font-size:13px;font-weight:600">'+Icon('check',13)+' Зареєстровано</div>';
    html+='</div></div>';
    el.innerHTML=html;
    document.getElementById("scan-ttn").value="";document.getElementById("scan-ttn").focus();
    loadStats();loadRecent();
  }catch(e){el.innerHTML='<div class="msg msg-err">'+Icon('x',13)+' '+esc(e.message)+'</div>';document.getElementById("scan-ttn").value="";document.getElementById("scan-ttn").focus()}
}

async function finalizeOrder(id){
  try{await api("/api/scan/finalize/"+id,{method:"POST"});
  document.getElementById("scan-result").innerHTML='<div class="msg msg-ok" style="font-size:14px;padding:14px;text-align:center">'+Icon('check',14)+' Замовлення #'+id+' відправлено!</div>';
  loadStats();loadRecent()}catch(e){}
}

function openForeignParcel(){document.getElementById("fp-phone").value="";document.getElementById("fp-msg").innerHTML="";document.getElementById("fp-modal").style.display="flex";setTimeout(function(){document.getElementById("fp-phone").focus()},50)}
function closeForeignParcel(){document.getElementById("fp-modal").style.display="none";document.getElementById("scan-ttn").focus()}
async function saveForeignParcel(){
  var phone=document.getElementById("fp-phone").value.trim();var msg=document.getElementById("fp-msg");
  if(!phone){msg.innerHTML='<div class="msg msg-err">Вкажіть номер телефону</div>';return}
  try{
    var r=await api("/api/foreign-parcels",{method:"POST",body:JSON.stringify({phone:phone})});
    closeForeignParcel();
    document.getElementById("scan-result").innerHTML='<div class="msg msg-ok" style="font-size:14px;padding:14px;text-align:center">'+Icon('check',14)+' Закордонну посилку зафіксовано<br><span style="font-family:JetBrains Mono,monospace">'+esc(r.parcel.phone)+'</span> · '+(r.parcel.packed_at||"").slice(0,16)+'</div>';
  }catch(e){msg.innerHTML='<div class="msg msg-err">'+Icon('x',13)+' '+esc(e.message)+'</div>'}
}

async function searchFinTtn(){
  var q=document.getElementById("fs-search").value.trim();var el=document.getElementById("fs-result");
  if(!q){el.innerHTML="";return}
  var html="";
  // Foreign parcels (за номером телефону)
  try{
    var fps=(await api("/api/foreign-parcels?phone="+encodeURIComponent(q))).parcels;
    html+=fps.map(function(p){return '<div style="background:var(--card);border:1px solid rgba(124,134,255,.35);border-radius:12px;padding:14px;margin-bottom:10px">'+
      '<div style="font-size:13px;font-weight:700;color:var(--acc)">'+Icon('package',13)+' Закордонна посилка</div>'+
      '<div style="font-size:15px;font-family:JetBrains Mono,monospace;color:var(--th);margin-top:4px">'+esc(p.phone)+'</div>'+
      '<div style="font-size:11px;color:var(--td);margin-top:4px">'+Icon('check',11)+' Запаковано: '+(p.packed_at||"").slice(0,16)+(p.packed_by_name?' · '+esc(p.packed_by_name):'')+'</div>'+
      '</div>'}).join("");
  }catch(e){}
  // Order by TTN
  try{
    var o=(await api("/api/orders/by-ttn/"+encodeURIComponent(q))).order;
    html+='<div style="background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:14px;margin-bottom:14px">'+
      '<div style="font-size:15px;font-weight:700;color:var(--th)">#'+o.id+' <span class="tag '+(SC[o.status]||"")+'">'+(SL[o.status]||o.status)+'</span></div>'+
      '<div style="font-size:12px;color:var(--th);margin-top:4px">'+esc(o.client_name)+'</div>'+
      (o.ttn?'<div style="font-size:12px;font-family:JetBrains Mono,monospace;color:'+ttnColor(o)+';margin-top:6px">ТТН: '+esc(o.ttn)+'</div>':'')+
      (o.packed_at?'<div style="font-size:11px;color:var(--td);margin-top:4px">'+Icon('check',11)+' Запаковано: '+o.packed_at.slice(0,16)+'</div>':'')+
      (o.shipped_at?'<div style="font-size:11px;color:var(--acc)">'+Icon('truck',11)+' Відправлено: '+o.shipped_at.slice(0,16)+'</div>':'')+
      (o.np_status_text?'<div style="font-size:11px;color:var(--td);margin-top:4px">'+Icon('package',11)+' '+esc(o.np_status_text)+'</div>':'')+
      '</div>';
  }catch(e){}
  el.innerHTML=html||'<div class="msg msg-err">'+Icon('x',13)+' Нічого не знайдено</div>';
}
async function loadFullStats(){
  try{var r=await api("/api/scan/stats");
  var html='<div class="sg"><div class="sc"><div class="sv" style="color:var(--acc)">'+r.today+'</div><div class="sl">сьогодні</div></div><div class="sc"><div class="sv" style="color:var(--td)">'+r.yesterday+'</div><div class="sl">вчора</div></div><div class="sc"><div class="sv" style="color:var(--th)">'+r.week+'</div><div class="sl">тиждень</div></div><div class="sc"><div class="sv" style="color:var(--red)">'+r.returnsToday+'</div><div class="sl">поверн. сьогодні</div></div></div>';
  // By day table
  var days={};r.byDay.forEach(function(d){if(!days[d.day])days[d.day]={ship:0,ret:0};if(d.scan_type==="shipment")days[d.day].ship=d.c;else days[d.day].ret=d.c});
  html+='<div style="font-size:13px;font-weight:600;color:var(--th);margin:14px 0 8px">По днях:</div>';
  html+='<table class="tbl"><tr><th>Дата</th><th>Відправлено</th><th>Повернень</th></tr>';
  Object.keys(days).forEach(function(d){html+='<tr><td>'+d+'</td><td style="color:var(--acc);font-weight:700">'+days[d].ship+'</td><td style="color:var(--red);font-weight:700">'+days[d].ret+'</td></tr>'});
  html+='</table>';
  // Recent
  html+='<div style="font-size:13px;font-weight:600;color:var(--th);margin:14px 0 8px">Останні сканування:</div>';
  html+='<table class="tbl"><tr><th>Час</th><th>ТТН</th><th>Клієнт</th><th>Тип</th><th>Статус НП</th></tr>';
  r.recent.forEach(function(s){html+='<tr><td style="white-space:nowrap;font-size:10px">'+(s.created_at?.slice(0,16)||"")+'</td><td style="font-family:JetBrains Mono,monospace;color:var(--warn);font-size:10px">'+esc(s.ttn)+'</td><td>'+esc(s.client_name||"")+'</td><td style="color:'+(s.scan_type==="return"?"var(--red)":"var(--acc)")+'">'+(s.scan_type==="return"?Icon('undo2',10)+" Поверн.":Icon('package',10)+" Відпр.")+'</td><td style="font-size:9px;color:var(--td)">'+esc(s.np_status_text||"")+'</td></tr>'});
  html+='</table>';
  document.getElementById("stats-content").innerHTML=html}catch(e){}
}

// ── MY SALARY ────────────────────────────────────────────────────
function setSalaryPeriod(days){
  var to=new Date();var from=new Date(to);from.setDate(from.getDate()-(days-1));
  document.getElementById("sal-df").value=from.toISOString().slice(0,10);
  document.getElementById("sal-dt").value=to.toISOString().slice(0,10);
  document.querySelectorAll("[id^=sal-p-]").forEach(function(b){b.classList.remove("on")});
  var pb=document.getElementById("sal-p-"+days);if(pb)pb.classList.add("on");
  loadSalary();
}
async function loadSalary(){
  var df=document.getElementById("sal-df").value,dt=document.getElementById("sal-dt").value;
  try{
    var r=await api("/api/my-payroll"+(df&&dt?"?date_from="+df+"&date_to="+dt:""));
    document.getElementById("sal-stats").innerHTML=
      '<div style="background:var(--card);border:1px solid var(--brd);border-radius:10px;padding:12px 18px;text-align:center;flex:1;min-width:120px"><div style="font-family:JetBrains Mono,monospace;font-size:20px;font-weight:700;color:var(--acc)">'+r.period_earned.toFixed(0)+'₴</div><div style="font-size:9px;color:var(--td);margin-top:2px">ЗАРОБЛЕНО ЗА ПЕРІОД</div></div>'+
      '<div style="background:var(--card);border:1px solid var(--brd);border-radius:10px;padding:12px 18px;text-align:center;flex:1;min-width:120px"><div style="font-family:JetBrains Mono,monospace;font-size:20px;font-weight:700;color:'+(r.balance>0?"var(--warn)":"var(--td)")+'">'+r.balance.toFixed(0)+'₴</div><div style="font-size:9px;color:var(--td);margin-top:2px">ДО ВИПЛАТИ (ВСЬОГО)</div></div>'+
      '<div style="background:var(--card);border:1px solid var(--brd);border-radius:10px;padding:12px 18px;text-align:center;flex:1;min-width:120px"><div style="font-family:JetBrains Mono,monospace;font-size:20px;font-weight:700;color:var(--td)">'+r.total_paid.toFixed(0)+'₴</div><div style="font-size:9px;color:var(--td);margin-top:2px">ВИПЛАЧЕНО ВСЬОГО</div></div>';
    document.getElementById("sal-entries").innerHTML=r.entries.length?'<table class="tbl"><tr><th>Дата</th><th>Замовлення</th><th>Опис</th><th>Сума</th></tr>'+r.entries.map(function(p){return '<tr><td style="font-size:10px;color:var(--td)">'+(p.created_at?.slice(0,16)||"")+'</td><td>'+(p.order_id?"#"+p.order_id:"—")+'</td><td style="font-size:11px;color:var(--td)">'+esc(p.note||p.type)+'</td><td style="font-family:JetBrains Mono,monospace;color:var(--acc);font-weight:700">+'+p.amount.toFixed(0)+'₴</td></tr>'}).join("")+'</table>':'<div class="empty"><span class="ic">'+Icon('wallet',30)+'</span>Немає нарахувань за цей період</div>';
    document.getElementById("sal-payouts").innerHTML=r.payouts.length?r.payouts.map(function(p){return '<div style="display:flex;justify-content:space-between;padding:8px 12px;background:var(--card);border:1px solid var(--brd);border-radius:8px;margin-bottom:6px"><div style="font-size:11px;color:var(--td)">'+(p.created_at?.slice(0,16)||"")+'</div><div style="font-family:JetBrains Mono,monospace;font-weight:700;color:var(--acc)">'+p.amount.toFixed(0)+'₴</div></div>'}).join(""):'<div style="font-size:11px;color:var(--td)">Ще не було виплат</div>';
  }catch(e){document.getElementById("sal-stats").innerHTML='<div class="msg msg-err">'+esc(e.message)+'</div>'}
}
RangePicker.init("sal-df", "sal-dt", {presets:[7,15,30]});

init();
</script>
