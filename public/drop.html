<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>CRM — Кабінет</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;600&display=swap');
:root{--bg:#0a0e17;--card:#111827;--input:#0d1220;--brd:#1e2740;--brd2:#2a3a5c;--t:#c8cdd5;--td:#5a6378;--th:#f0f2f5;--acc:#00d4aa;--accbg:rgba(0,212,170,.06);--red:#ff6b6b;--redbg:rgba(255,107,107,.06);--warn:#ffa726;--blue:#42a5f5;--r:14px}
*{margin:0;padding:0;box-sizing:border-box}html,body{background:var(--bg);color:var(--t);font-family:'Inter',sans-serif;min-height:100vh}
.wrap{max-width:700px;margin:0 auto;padding:14px 14px 40px}
.hdr{display:flex;justify-content:space-between;align-items:center;padding-bottom:12px;border-bottom:1px solid var(--brd);margin-bottom:14px}
.hdr h1{font-size:17px;font-weight:700;color:var(--th)}.hdr small{font-size:11px;color:var(--td);display:block;margin-top:2px}
.btn-out{background:none;border:1px solid var(--brd);border-radius:7px;color:var(--td);padding:7px 14px;font-size:11px;font-family:inherit;cursor:pointer}
.btn-new{display:block;width:100%;padding:16px;font-size:16px;font-family:inherit;font-weight:700;background:#22c55e;color:#fff;border:none;border-radius:12px;cursor:pointer;margin-bottom:16px;transition:.2s}
.btn-new:hover{opacity:.9}
.sg{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:16px}
.sc{background:var(--card);border:1px solid var(--brd);border-radius:12px;padding:12px;text-align:center}
.sc .sv{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700}.sc .sl{font-size:8px;color:var(--td);text-transform:uppercase;margin-top:3px}
.ocard{background:var(--card);border:1px solid var(--brd);border-radius:var(--r);margin-bottom:10px;overflow:hidden;cursor:pointer;transition:.15s}
.ocard:hover{border-color:var(--brd2)}
.ocard-row{display:flex;justify-content:space-between;padding:12px 14px;align-items:center}
.ocard-id{font-size:15px;font-weight:700;color:var(--th)}.ocard-client{font-size:12px;color:var(--t)}.ocard-date{font-size:10px;color:var(--td)}
.ocard-amounts{text-align:right}.ocard-cod{font-family:'JetBrains Mono',monospace;font-size:14px;color:var(--th)}.ocard-payout{font-size:12px;color:var(--acc);font-weight:600}
.tag{display:inline-block;font-size:9px;font-weight:600;padding:2px 8px;border-radius:5px}
.tag-new{background:var(--accbg);color:var(--acc)}.tag-prog{background:rgba(66,165,245,.08);color:var(--blue)}.tag-ship{background:rgba(255,167,38,.08);color:var(--warn)}.tag-done{background:rgba(34,197,94,.08);color:#22c55e}.tag-bad{background:var(--redbg);color:var(--red)}
.empty{text-align:center;padding:40px;color:var(--td)}.empty .ic{font-size:48px;display:block;margin-bottom:8px}
.modal-bg{display:none;position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:100;align-items:flex-start;justify-content:center;padding-top:20px;overflow-y:auto}
.modal-bg.on{display:flex}
.modal{background:var(--card);border:1px solid var(--brd);border-radius:16px;padding:20px;width:94%;max-width:600px;margin-bottom:40px}
.modal h3{font-size:17px;font-weight:700;color:var(--th);margin-bottom:14px}
.fld{margin-bottom:10px}.fld label{display:block;font-size:10px;color:var(--td);margin-bottom:3px;font-weight:500;text-transform:uppercase}
.fld input,.fld select{width:100%;padding:10px 12px;font-size:13px;font-family:inherit;background:var(--input);border:1px solid var(--brd2);border-radius:8px;color:#fff;outline:0}.fld input:focus{border-color:var(--acc)}
.fld-row{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.btn{padding:10px 20px;font-size:13px;font-family:inherit;font-weight:600;border:1px solid var(--brd);border-radius:10px;cursor:pointer;background:var(--card);color:var(--t)}.btn:hover{border-color:var(--brd2)}
.btn-p{background:var(--acc);color:#0a0e17;border-color:var(--acc)}.btn-d{border-color:rgba(255,107,107,.2);color:var(--red)}.btn-sm{padding:6px 12px;font-size:11px}
.msg{padding:10px 14px;border-radius:8px;font-size:12px;margin-bottom:10px}.msg-ok{background:var(--accbg);color:var(--acc)}.msg-err{background:var(--redbg);color:var(--red)}
/* Product search in order */
.prod-search{width:100%;padding:10px 12px;font-size:13px;background:var(--input);border:1px solid var(--brd2);border-radius:8px;color:#fff;outline:0;margin-bottom:8px}
.prod-search:focus{border-color:var(--acc)}
.prod-results{max-height:250px;overflow-y:auto;margin-bottom:10px}
.prod-item{display:flex;gap:8px;padding:8px;border-bottom:1px solid var(--brd);align-items:center;cursor:pointer;transition:.1s}
.prod-item:hover{background:rgba(255,255,255,.02)}
.prod-item img{width:50px;height:50px;border-radius:6px;object-fit:cover}
.prod-item-info{flex:1}.prod-item-name{font-size:12px;font-weight:600;color:var(--th)}.prod-item-price{font-size:11px;color:var(--acc)}
.prod-sizes{display:flex;gap:3px;flex-wrap:wrap;margin-top:4px}
.prod-sz{font-size:10px;padding:3px 8px;border-radius:5px;background:var(--bg);border:1px solid var(--brd);color:var(--t);cursor:pointer;font-family:'JetBrains Mono',monospace;transition:.15s}
.prod-sz:hover{border-color:var(--acc)}.prod-sz.zero{color:var(--red);border-color:rgba(255,107,107,.15)}
/* Order items in form */
.oi-card{display:flex;gap:8px;padding:8px;background:var(--bg);border-radius:8px;margin-bottom:6px;align-items:center}
.oi-card img{width:40px;height:40px;border-radius:6px;object-fit:cover}
.oi-card-info{flex:1;font-size:12px;color:var(--th)}.oi-card-size{color:var(--acc);font-weight:600;font-size:12px}
.oi-card-price{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--td)}
.oi-del{background:none;border:none;color:var(--red);cursor:pointer;font-size:14px;padding:4px}
/* Order detail */
.od-item{display:flex;gap:10px;padding:10px 0;border-bottom:1px solid var(--brd);align-items:center}
.od-item img{width:50px;height:50px;border-radius:6px;object-fit:cover}
</style>
</head>
<body>
<div class="wrap">
  <div class="hdr"><div><h1>🛒 Кабінет</h1><small id="u-info">—</small></div><button class="btn-out" onclick="logout()">Вийти</button></div>
  <div class="sg">
    <div class="sc"><div class="sv" style="color:var(--acc)" id="st-total">0</div><div class="sl">замовлень</div></div>
    <div class="sc"><div class="sv" style="color:var(--warn)" id="st-new">0</div><div class="sl">нових</div></div>
    <div class="sc"><div class="sv" style="color:var(--acc)" id="st-payout">0₴</div><div class="sl">до виплати</div></div>
  </div>
  <button class="btn-new" onclick="openNewOrder()">＋ Подати замовлення</button>
  <div id="orders-list"></div>
</div>

<!-- Order detail modal -->
<div class="modal-bg" id="od-modal"><div class="modal">
<h3 id="od-title">Замовлення</h3>
<div id="od-body"></div>
<div style="margin-top:12px"><button class="btn" onclick="clM('od-modal')">Закрити</button></div>
</div></div>

<!-- New order modal -->
<div class="modal-bg" id="no-modal"><div class="modal">
<h3>＋ Нове замовлення</h3>
<div class="fld"><label>Додати товар</label>
<input class="prod-search" id="no-search" placeholder="Пошук товару..." oninput="searchProducts(this.value)">
<div class="prod-results" id="no-results"></div>
</div>
<div class="fld"><label>Товари в замовленні</label><div id="no-items"></div></div>
<div class="fld"><label>ПІБ клієнта</label><input id="no-name"></div>
<div class="fld"><label>Телефон</label><input id="no-phone" placeholder="+380..."></div>
<div class="fld-row"><div class="fld"><label>Місто</label><input id="no-city"></div><div class="fld"><label>Відділення НП</label><input id="no-wh"></div></div>
<div class="fld"><label>Сума наложки ₴</label><input id="no-cod" type="number" oninput="calcPay()"></div>
<div id="no-pay" style="font-size:13px;margin:6px 0;color:var(--th)"></div>
<div class="fld"><label>Примітка</label><input id="no-note"></div>
<div id="no-err" class="msg msg-err" style="display:none"></div>
<div style="display:flex;gap:6px;margin-top:12px">
<button class="btn-new" style="flex:1;margin:0" onclick="submitOrder()">✅ Оформити замовлення</button>
<button class="btn" onclick="clM('no-modal')">Скасувати</button>
</div>
</div></div>

<script>
var ME,allVars=[],allSizes=[],orderItems=[];
var SL={new:"Нове",in_progress:"В роботі",packed:"Готово",shipped:"Відправлено",delivering:"Доставка",delivered:"Отримано",refused:"Відмова",cancelled:"Скасовано"};
var SCL={new:"tag-new",in_progress:"tag-prog",packed:"tag-done",shipped:"tag-ship",delivering:"tag-ship",delivered:"tag-done",refused:"tag-bad",cancelled:"tag-bad"};

async function init(){
  try{ME=(await api("/api/auth/me")).user;document.getElementById("u-info").textContent=ME.name;loadDash();loadOrders()}catch(e){location.href="/login"}
}
async function logout(){await fetch("/api/auth/logout",{method:"POST"});location.href="/login"}
function esc(s){var d=document.createElement("div");d.textContent=s||"";return d.innerHTML}
async function api(u,o){var r=await fetch(u,{headers:{"Content-Type":"application/json"},method:"GET",...o});var d=await r.json();if(!r.ok)throw new Error(d.error||"Помилка");return d}
function clM(id){document.getElementById(id).classList.remove("on")}
function opM(id){document.getElementById(id).classList.add("on")}

async function loadDash(){
  var d=await api("/api/dashboard");
  document.getElementById("st-total").textContent=d.my_orders_total||0;
  document.getElementById("st-new").textContent=d.my_orders_new||0;
  document.getElementById("st-payout").textContent=(d.my_payout||0).toFixed(0)+"₴";
}

async function loadOrders(){
  var r=await api("/api/orders");
  var el=document.getElementById("orders-list");
  if(!r.orders.length){el.innerHTML='<div class="empty"><span class="ic">📋</span>Немає замовлень<br>Натисніть кнопку вище щоб подати перше</div>';return}
  el.innerHTML=r.orders.map(function(o){
    return '<div class="ocard" onclick="viewOrder('+o.id+')"><div class="ocard-row"><div><div class="ocard-id">#'+o.id+' <span class="tag '+(SCL[o.status]||"")+'">'+(SL[o.status]||o.status)+'</span></div><div class="ocard-client">'+esc(o.client_name)+' · '+esc(o.client_phone)+'</div><div class="ocard-date">'+(o.created_at?o.created_at.slice(0,16):"")+'</div></div><div class="ocard-amounts"><div class="ocard-cod">'+o.cod_amount+'₴</div><div class="ocard-payout">+'+o.payout_amount.toFixed(0)+'₴</div></div></div></div>';
  }).join("");
}

async function viewOrder(id){
  var o=(await api("/api/orders/"+id)).order;
  document.getElementById("od-title").textContent="Замовлення #"+o.id;
  var h='<div><div style="margin-bottom:8px"><span class="tag '+(SCL[o.status]||"")+'">'+(SL[o.status]||o.status)+'</span></div>';
  h+='<div style="font-size:13px;color:var(--th)">'+esc(o.client_name)+' · <span style="color:var(--acc)">'+esc(o.client_phone)+'</span></div>';
  h+='<div style="font-size:12px;color:var(--td)">'+esc(o.client_city)+' · '+esc(o.client_warehouse)+'</div>';
  if(o.ttn)h+='<div style="font-size:12px;color:var(--warn);font-family:JetBrains Mono,monospace;margin-top:4px">ТТН: '+esc(o.ttn)+'</div>';
  h+='<div style="margin-top:10px">';
  for(var i=0;i<o.items.length;i++){
    var it=o.items[i];
    h+='<div class="od-item">'+(it.var_photo?'<img src="'+it.var_photo+'">':'<div style="width:50px;height:50px;background:var(--bg);border-radius:6px"></div>');
    h+='<div style="flex:1"><div style="font-size:13px;font-weight:600;color:var(--th)">'+esc(it.var_name)+'</div><div style="margin-top:2px"><span style="color:var(--acc);font-weight:700">'+esc(it.size_name)+'</span>';
    if(it.quantity>1)h+=' ×'+it.quantity;
    h+='</div></div><div style="font-family:JetBrains Mono,monospace;color:var(--td)">'+(it.drop_price*it.quantity).toFixed(0)+'₴</div></div>';
  }
  h+='</div>';
  h+='<div style="margin-top:12px;text-align:right;font-size:14px"><div>Наложка: <strong>'+o.cod_amount+'₴</strong></div>';
  h+='<div>Дроп: '+o.total_drop_price.toFixed(0)+'₴</div>';
  h+='<div style="color:var(--acc);font-size:16px;font-weight:700">Заробіток: '+o.payout_amount.toFixed(0)+'₴</div></div>';
  if(o.note)h+='<div style="margin-top:8px;font-size:12px;color:var(--warn)">📝 '+esc(o.note)+'</div>';
  h+='</div>';
  document.getElementById("od-body").innerHTML=h;
  opM("od-modal");
}

// ── New order ────────────────────────────────────────────────────
async function openNewOrder(){
  orderItems=[];
  document.getElementById("no-search").value="";
  document.getElementById("no-results").innerHTML="";
  document.getElementById("no-items").innerHTML='<div style="color:var(--td);font-size:11px">Шукайте товар вище і натисніть на розмір</div>';
  ["no-name","no-phone","no-city","no-wh","no-cod","no-note"].forEach(function(id){document.getElementById(id).value=""});
  document.getElementById("no-pay").innerHTML="";
  document.getElementById("no-err").style.display="none";
  // Load all variations
  var d=await api("/api/variations");allVars=d.variations;allSizes=d.sizes;
  // Also load kits
  try{var kd=await api("/api/kits");kd.kits.forEach(function(k){k.is_kit=true;allVars.push(k)})}catch(e){}
  opM("no-modal");
  document.getElementById("no-search").focus();
}

var searchTimer;
function searchProducts(q){
  clearTimeout(searchTimer);
  searchTimer=setTimeout(function(){
    var el=document.getElementById("no-results");
    if(!q||q.length<1){el.innerHTML="";return}
    var filtered=allVars.filter(function(v){return v.name.toLowerCase().includes(q.toLowerCase())}).slice(0,15);
    if(!filtered.length){el.innerHTML='<div style="padding:10px;color:var(--td);font-size:11px">Нічого не знайдено</div>';return}
    el.innerHTML=filtered.map(function(v){
      var szs=allSizes.filter(function(s){return v.stock&&v.stock[s.id]!==undefined});
      var photo=v.photo||v.print_photo||"";
      var isKit=v.is_kit;
      return '<div class="prod-item"><div>'+(photo?'<img src="'+photo+'">':'<div style="width:50px;height:50px;background:var(--bg);border-radius:6px"></div>')+'</div><div class="prod-item-info"><div class="prod-item-name">'+esc(v.name)+(isKit?' <span style="font-size:8px;color:var(--warn)">🎁</span>':'')+'</div><div class="prod-item-price">'+v.drop_price+'₴</div><div class="prod-sizes">'+szs.map(function(s){var q2=v.stock[s.id]||0;return '<span class="prod-sz '+(q2<=0?"zero":"")+'" onclick="event.stopPropagation();addItem('+v.id+','+s.id+',\''+esc(v.name).replace(/'/g,"\\'")+'\','+v.drop_price+',\''+s.name+'\',\''+(photo).replace(/'/g,"\\'")+'\','+(isKit?"true":"false")+')">'+s.name+'<br>'+q2+'</span>'}).join("")+'</div></div></div>';
    }).join("");
  },200);
}

function addItem(vid,sid,name,price,sizeName,photo,isKit){
  orderItems.push({varId:vid,sizeId:sid,name:name,price:price,sizeName:sizeName,photo:photo,qty:1,kitId:isKit?vid:null});
  renderOrderItems();
  calcPay();
}

function renderOrderItems(){
  var el=document.getElementById("no-items");
  if(!orderItems.length){el.innerHTML='<div style="color:var(--td);font-size:11px">Шукайте товар вище і натисніть на розмір</div>';return}
  el.innerHTML=orderItems.map(function(c,i){
    return '<div class="oi-card">'+(c.photo?'<img src="'+c.photo+'">':'<div style="width:40px;height:40px;background:var(--bg);border-radius:6px"></div>')+'<div class="oi-card-info">'+esc(c.name)+'</div><div class="oi-card-size">'+c.sizeName+'</div><div style="display:flex;align-items:center;gap:4px"><button onclick="chQty('+i+',-1)" style="background:var(--bg);border:1px solid var(--brd);border-radius:4px;color:var(--t);width:22px;height:22px;cursor:pointer">−</button><span style="font-family:JetBrains Mono,monospace;min-width:18px;text-align:center">'+c.qty+'</span><button onclick="chQty('+i+',1)" style="background:var(--bg);border:1px solid var(--brd);border-radius:4px;color:var(--t);width:22px;height:22px;cursor:pointer">+</button></div><div class="oi-card-price">'+(c.price*c.qty).toFixed(0)+'₴</div><button class="oi-del" onclick="rmItem('+i+')">✕</button></div>';
  }).join("");
}

function chQty(i,d){orderItems[i].qty=Math.max(1,orderItems[i].qty+d);renderOrderItems();calcPay()}
function rmItem(i){orderItems.splice(i,1);renderOrderItems();calcPay()}

function calcPay(){
  var cod=parseFloat(document.getElementById("no-cod").value)||0;
  var drop=orderItems.reduce(function(s,c){return s+c.price*c.qty},0);
  var pay=cod-drop;
  document.getElementById("no-pay").innerHTML=cod?'Дроп: '+drop.toFixed(0)+'₴ · <strong style="color:'+(pay>=0?'var(--acc)':'var(--red)')+'">Заробіток: '+pay.toFixed(0)+'₴</strong>':"";
}

async function submitOrder(){
  var err=document.getElementById("no-err");err.style.display="none";
  if(!orderItems.length){err.textContent="Додайте товари";err.style.display="block";return}
  var data={
    items:orderItems.map(function(c){return{variation_id:c.kitId?undefined:c.varId,size_id:c.sizeId,quantity:c.qty,kit_id:c.kitId||undefined}}),
    client_name:document.getElementById("no-name").value,
    client_phone:document.getElementById("no-phone").value,
    client_city:document.getElementById("no-city").value,
    client_warehouse:document.getElementById("no-wh").value,
    cod_amount:parseFloat(document.getElementById("no-cod").value)||0,
    note:document.getElementById("no-note").value
  };
  try{
    var r=await api("/api/orders",{method:"POST",body:JSON.stringify(data)});
    clM("no-modal");loadDash();loadOrders();
    alert("✅ Замовлення #"+r.order_id+" створено!\nЗаробіток: "+r.payout.toFixed(0)+"₴");
  }catch(e){err.textContent=e.message;err.style.display="block"}
}

init();
</script>
</body>
</html>
