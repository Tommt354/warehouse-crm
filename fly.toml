app = "warehouse-crm"
primary_region = "fra"

[build]

[env]
  PORT = "3000"
  DB_PATH = "/data/crm.db"

[mounts]
  source = "data"
  destination = "/data"

[http_service]
  internal_port = 3000
  force_https = true
  auto_stop_machines = "off"
  auto_start_machines = true
  min_machines_running = 1

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
